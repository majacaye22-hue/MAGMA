  <path d="M-80 370C130 330 30 40 300 65S420 410 650 280S760 70 920 120" stroke="#E12120" stroke-width="125" opacity=".35" filter="url(#soft)"/>
  <path d="M-80 370C130 330 30 40 300 65S420 410 650 280S760 70 920 120" stroke="url(#ink)" stroke-width="76"/>
  <path d="M-40 410C170 320 120 150 300 160S520 470 850 260" stroke="#E12120" stroke-width="24" opacity=".65"/>
  <path d="M-80 370C130 330 30 40 300 65S420 410 650 280S760 70 920 120" stroke="#0c0c0b" stroke-width="18" opacity=".7"/>
</g>
<rect width="800" height="400" filter="url(#grain)"/>
</svg>
