<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="glow" cx="75%" cy="70%" r="80%">
      <stop offset="0" stop-color="#E12120" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#E12120" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0c0c0b"/>
    </radialGradient>
    <filter id="ink" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 .025" numOctaves="3" seed="16"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.047 0 0 0 0 0.047 0 0 0 0 0.043 0 0 0 1.5 -0.25"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" seed="34"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.047 0 0 0 0 0.047 0 0 0 0 0.043 0 0 0 .4 0"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="#0c0c0b"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <rect width="800" height="400" filter="url(#ink)"/>
  <rect width="800" height="400" filter="url(#grain)"/>
</svg>
